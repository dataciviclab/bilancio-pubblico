name: dashboard

# Gli smoke test della dashboard non passano da `check.yml`: quello valida i
# dataset (dataset.yml), non le pagine Streamlit. Senza questo job una pagina
# rotta — o un mart che cambia schema — arriva in produzione senza segnali.
# I test girano sui dati pubblicati su GCS quando `out/` non esiste (CI),
# quindi verificano anche il percorso reale della dashboard.

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "registry/registry.json"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "registry/registry.json"
  workflow_dispatch:

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,dashboard"

      - name: Smoke test (ogni pagina esegue sui dati reali)
        working-directory: dashboard
        run: python -m pytest tests/ -q
