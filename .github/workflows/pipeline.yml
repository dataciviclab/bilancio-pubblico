name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "support/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Anni (es. 2025 o all)"
        required: false
        default: ""

concurrency:
  group: bilancio-pubblico-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "bilancio-pubblico"
      run-command: "make run-all"
      run-batch-command: "make run-batch"
      detect-paths: "datasets"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit

  # Verifica che la dashboard regga i dati appena pubblicati: è qui che un mart
  # che cambia schema si manifesta, perché prima del merge i parquet su GCS
  # sono ancora quelli vecchi.
  dashboard-smoke:
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,dashboard"

      - name: Smoke test dashboard sui dati pubblicati
        working-directory: dashboard
        run: python -m pytest tests/ -q
