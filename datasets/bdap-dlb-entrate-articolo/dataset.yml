root: "../../out"
schema_version: 1

dataset:
  name: "bdap_dlb_entrate_articolo"
  source_id: "openbdap"
  tags: [finanza-pubblica, bdap, entrate, dlb, previsione, articolo, bilancio-stato]
  category: finanza-pubblica
  description: "Disegno di Legge di Bilancio Presentato — Entrate per capitolo e articolo, 2017-2027. Bilancio dell'anno precedente, DLB Sezione II, effetti del DLB Sez. I e DLB integrato per titolo/natura/tipologia/categoria su CP/CS triennali. E' la previsione per articolo: il Rendiconto per articolo e' il consuntivo."
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027]
  time_coverage:
    start_year: 2017
    end_year: 2027

raw:
  output_policy: overwrite
  sources:
    - name: "dlb_entrate_articolo"
      type: "http_file"
      args:
        url: "https://bdap-opendata.rgs.mef.gov.it/SpodCkanApi/api/3/datastore/dump/"
        filename: "dlb_entrate_articolo_{year}.csv"
        url_suffix_by_year:
          2017: "34f5ce61-6c23-4982-adbc-866190e76ed0.csv"
          2018: "66e105e8-8bcf-45fe-b2f9-6c1b2e505b0d.csv"
          2019: "f4c5fe39-d735-4e2c-aff1-2016d100ab67.csv"
          2020: "ce3c7709-cd08-4b81-bd35-b50f344ba611.csv"
          2021: "a02d4023-7fc2-48f0-b947-92f00d05611e.csv"
          2022: "4c3fe6d2-9f68-4932-a156-50651c5e6bde.csv"
          2023: "f249ba32-a6e4-4018-a1a7-8620da98fdf8.csv"
          2024: "5bcd8c2c-db56-4dd2-a8d4-21eb49709573.csv"
          2025: "d5e9e866-49f0-4bb9-8bf5-f89b69cedb2e.csv"
          2026: "56e64028-7f1d-4f8a-9c96-6e2038fc60ee.csv"
          2027: "bd8127fe-05ae-442c-b456-7444e862de2f.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    header: true
    delim: ";"
    encoding: "cp1252"
    strict_mode: false
    trim_whitespace: true
    # 52 colonne dal 2018. Il 2017 ne ha 48: al posto delle 7 "Nuove norme DLB
    # Sez. II" ha 3 "Variazioni proposte" (43,8 mld nel 2017, non comparabili con
    # le Nuove norme: 0,4-4,1 mld dal 2018). Entrambe mappate, l'assente e' NULL.
    normalize_rows_to_columns: true
    align_by_header: true
    columns:
      "Esercizio Finanziario": "VARCHAR"
      "Stato di Previsione": "VARCHAR"
      "Centro Responsabilità": "VARCHAR"
      "Amministrazione": "VARCHAR"
      "Numero Capitolo di Entrata": "VARCHAR"
      "Capitolo di Entrata": "VARCHAR"
      "Numero Articolo": "VARCHAR"
      "Articolo": "VARCHAR"
      "Codice Titolo": "VARCHAR"
      "Titolo": "VARCHAR"
      "Codice Natura": "VARCHAR"
      "Natura": "VARCHAR"
      "Codice Tipologia": "VARCHAR"
      "Tipologia": "VARCHAR"
      "Codice Attività/Provento": "VARCHAR"
      "Attività/Provento": "VARCHAR"
      "Codice Categoria": "VARCHAR"
      "Categoria": "VARCHAR"
      "Codice Puntato SEC95": "VARCHAR"
      "Prev. Bil. Esercizio prec. CP": "VARCHAR"
      "Prev. Bil. Esercizio prec. CS": "VARCHAR"
      "Prev. Bil. Esercizio prec. RS": "VARCHAR"
      "Ass. Bil. Esercizio prec. CP": "VARCHAR"
      "Ass. Bil. Esercizio prec. CS": "VARCHAR"
      "Ass. Bil. Esercizio prec. RS": "VARCHAR"
      "DLB Sezione II CP A1": "VARCHAR"
      "DLB Sezione II CP A2": "VARCHAR"
      "DLB Sezione II CP A3": "VARCHAR"
      "DLB Sezione II CS A1": "VARCHAR"
      "DLB Sezione II CS A2": "VARCHAR"
      "DLB Sezione II CS A3": "VARCHAR"
      "DLB Sezione II RS A1": "VARCHAR"
      "Nuove norme DLB Sez. II CP A1": "VARCHAR"
      "Nuove norme DLB Sez. II CP A2": "VARCHAR"
      "Nuove norme DLB Sez. II CP A3": "VARCHAR"
      "Nuove norme DLB Sez. II CS A1": "VARCHAR"
      "Nuove norme DLB Sez. II CS A2": "VARCHAR"
      "Nuove norme DLB Sez. II CS A3": "VARCHAR"
      "Nuove norme DLB Sez. II RS A1": "VARCHAR"
      "Effetti fin. DLB Sez. I CP A1": "VARCHAR"
      "Effetti fin. DLB Sez. I CP A2": "VARCHAR"
      "Effetti fin. DLB Sez. I CP A3": "VARCHAR"
      "Effetti fin. DLB Sez. I CS A1": "VARCHAR"
      "Effetti fin. DLB Sez. I CS A2": "VARCHAR"
      "Effetti fin. DLB Sez. I CS A3": "VARCHAR"
      "DLB Integrato CP A1": "VARCHAR"
      "DLB Integrato CP A2": "VARCHAR"
      "DLB Integrato CP A3": "VARCHAR"
      "DLB Integrato CS A1": "VARCHAR"
      "DLB Integrato CS A2": "VARCHAR"
      "DLB Integrato CS A3": "VARCHAR"
      "DLB Integrato RS A1": "VARCHAR"
      "Variazioni proposte CP A1": "VARCHAR"
      "Variazioni proposte CS A1": "VARCHAR"
      "Variazioni proposte RS A1": "VARCHAR"
  required_columns:
    - anno
    - stato_previsione
    - numero_capitolo
    - numero_articolo
    - codice_titolo
    - dlb_integrato_cp_a1
  validate:
    min_rows: 1000
    not_null: [anno, stato_previsione, numero_capitolo]
    primary_key: [anno, stato_previsione, numero_capitolo, numero_articolo]

mart:
  tables:
    - name: "mart_articolo"
      sql: "sql/mart_articolo.sql"
    - name: "mart_anno"
      sql: "sql/mart_anno.sql"
    - name: "mart_titolo"
      sql: "sql/mart_titolo.sql"
    - name: "mart_variazione_articolo"
      sql: "sql/mart_variazione_articolo.sql"
  required_tables:
    - "mart_articolo"
    - "mart_anno"
    - "mart_titolo"
    - "mart_variazione_articolo"
  validate:
    table_rules:
      mart_articolo:
        min_rows: 1000
        primary_key: [anno, stato_previsione, numero_capitolo, numero_articolo]
      mart_anno:
        min_rows: 1
        primary_key: [anno]
      mart_titolo:
        min_rows: 4
        primary_key: [anno, codice_titolo]
      mart_variazione_articolo:
        required_columns: [anno, numero_capitolo, numero_articolo, delta_vs_prec_cp_a1_mln]
        primary_key: [anno, stato_previsione, numero_capitolo, numero_articolo]
        min_rows: 1000

validation:
  fail_on_error: true

output:
  artifacts: minimal
